<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>문서함 - 문서 비서</title>
  <link rel="stylesheet" href="css/style.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
</head>
<body>
  <main class="container">
    <h1>문서함</h1>
    <label class="field"><input type="search" id="q" placeholder="🔍 제목·내용으로 검색 (예: 체험학습, 과제)" /></label>
    <div class="row-gap" id="filters"></div>
    <div id="list"></div>
  </main>

  <script type="module">
    import { initPage } from './js/nav.js';
    import { getDocs, getTasks, deleteDoc } from './js/storage.js';
    import { getPages } from './js/archive.js';
    import { downloadPdf } from './js/agents/scanAgent.js';
    import { DOC_TYPES, AUDIENCES, TASK_KINDS } from './js/agents/analyzeAgent.js';
    import { esc, formatDue } from './js/util.js';
    import { downloadIcs } from './js/ics.js';

    initPage('docs.html');
    const $ = (s) => document.querySelector(s);
    let filter = 'all';
    const urls = [];

    const FILTERS = { all: '전체', parent: '🏫 학부모', student: '🎓 대학생', reply: '✍️ 회신 필요', payment: '💳 납부' };
    $('#filters').innerHTML = Object.entries(FILTERS)
      .map(([k, v]) => `<button class="btn small" data-f="${k}">${v}</button>`).join('');
    $('#filters').querySelectorAll('button').forEach((b) => b.addEventListener('click', () => { filter = b.dataset.f; render(); }));

    function matches(d, q) {
      if (filter === 'parent' || filter === 'student') { if (d.audience !== filter) return false; }
      if (filter === 'reply' && !d.reply) return false;
      if (filter === 'payment' && !d.payment) return false;
      if (!q) return true;
      const text = [d.title, d.summary, ...(d.keyPoints || [])].join(' ').toLowerCase();
      return q.toLowerCase().split(/\s+/).every((w) => text.includes(w));
    }

    async function render() {
      $('#filters').querySelectorAll('button').forEach((b) => b.classList.toggle('primary', b.dataset.f === filter));
      urls.splice(0).forEach(URL.revokeObjectURL);
      const q = $('#q').value.trim();
      const docs = getDocs().filter((d) => matches(d, q));
      const tasks = getTasks();
      if (!docs.length) {
        $('#list').innerHTML = `<p class="muted card">${getDocs().length ? '조건에 맞는 문서가 없습니다.' : '아직 올린 문서가 없습니다. <a href="upload.html">문서 올리기</a>'}</p>`;
        return;
      }
      $('#list').innerHTML = docs.map((d) => {
        const t = DOC_TYPES[d.docType] || DOC_TYPES.other;
        const dt = tasks.filter((x) => x.docId === d.id && x.kind !== 'step');
        return `<details class="card doc" id="${d.id}" ${location.hash === '#' + d.id ? 'open' : ''}>
          <summary>
            <span class="pill">${t.icon} ${t.label}</span>
            ${d.audience ? `<span class="pill">${AUDIENCES[d.audience] || ''}</span>` : ''}
            ${d.demo ? '<span class="pill warn">예시</span>' : ''}
            <b>${esc(d.title)}</b>
            <span class="muted">${new Date(d.createdAt).toLocaleDateString('ko-KR')}</span>
          </summary>
          <div class="page-strip" data-doc="${d.id}"></div>
          <p>${esc(d.summary)}</p>
          ${d.keyPoints?.length ? `<ul>${d.keyPoints.map((p) => `<li>${esc(p)}</li>`).join('')}</ul>` : ''}
          ${d.reply ? `<div class="extra reply">✍️ 회신: ${esc(d.reply.what)} — ${esc(d.reply.method)}${d.reply.due_date ? ` (${esc(d.reply.due_date)}까지)` : ''}</div>` : ''}
          ${d.payment ? `<div class="extra payment">💳 ${esc(d.payment.amount)}${d.payment.method ? ` · ${esc(d.payment.method)}` : ''}${d.payment.account ? ` · ${esc(d.payment.bank || '')} ${esc(d.payment.account)}` : ''}</div>` : ''}
          ${d.contacts?.length ? `<div class="extra">📞 ${d.contacts.map((c) => `${esc(c.name)} <a href="tel:${esc(c.phone.replace(/[^0-9+]/g, ''))}">${esc(c.phone)}</a>`).join(' · ')}</div>` : ''}
          ${dt.length ? `<h3>할 일</h3><ul>${dt.map((x) => `<li>${x.done ? '✅' : '⬜'} <span class="kind ${TASK_KINDS[x.kind]?.cls || ''}">${TASK_KINDS[x.kind]?.label || ''}</span> ${esc(x.title)} <span class="muted">${esc(formatDue(x))}</span> <a href="calendar.html?date=${x.dueDate}">보기</a></li>`).join('')}</ul>` : ''}
          <div class="row-gap">
            <button class="btn small pdf" data-id="${d.id}">PDF 다시 받기</button>
            <button class="btn small ics" data-id="${d.id}">📅 휴대폰 캘린더로</button>
            <span class="spacer"></span>
            <button class="btn small danger del" data-id="${d.id}">삭제</button>
          </div>
        </details>`;
      }).join('');

      // 저장된 페이지 이미지 불러오기
      for (const strip of $('#list').querySelectorAll('.page-strip')) {
        const blobs = await getPages(strip.dataset.doc);
        strip.innerHTML = blobs.map((b, i) => {
          const u = URL.createObjectURL(b);
          urls.push(u);
          return `<a href="${u}" target="_blank" rel="noopener"><img src="${u}" alt="${i + 1}쪽" /></a>`;
        }).join('');
        strip.hidden = !blobs.length;
      }

      $('#list').querySelectorAll('.pdf').forEach((b) => b.addEventListener('click', async () => {
        const blobs = await getPages(b.dataset.id);
        if (!blobs.length) { alert('저장된 페이지 이미지가 없습니다. (PDF로 올린 문서는 원본 파일을 사용하세요)'); return; }
        const imgs = await Promise.all(blobs.map((blob) => new Promise((res) => {
          const img = new Image();
          img.onload = () => res(img);
          img.src = URL.createObjectURL(blob);
        })));
        downloadPdf(imgs, getDocs().find((d) => d.id === b.dataset.id)?.title || '문서');
      }));
      $('#list').querySelectorAll('.ics').forEach((b) => b.addEventListener('click', () => {
        const list = getTasks().filter((t) => t.docId === b.dataset.id && !t.done);
        if (!list.length) { alert('내보낼 할 일이 없습니다.'); return; }
        downloadIcs(list, getDocs().find((d) => d.id === b.dataset.id)?.title || '할일');
      }));
      $('#list').querySelectorAll('.del').forEach((b) => b.addEventListener('click', () => {
        if (confirm('이 문서와 연결된 할 일을 모두 삭제할까요?')) { deleteDoc(b.dataset.id); render(); }
      }));
    }

    $('#q').addEventListener('input', render);
    render();
  </script>
</body>
</html>
